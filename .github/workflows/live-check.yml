# Checks the real website + server: accounts on the server, used from four separate browsers (= devices).
# The check accounts are deleted again at the end. Results appear as notes on the commit.
name: Live check

on:
  push:
    branches: [source]
    paths: ['tests/live/**', '.github/workflows/live-check.yml']
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser
        run: |
          ( pip install playwright && python -m playwright install --with-deps chromium ) > install.log 2>&1 || { printf '::error::install failed: %s\n' "$(tail -30 install.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
      - name: Wait for the website to be updated
        run: sleep 90
      - name: Live check
        env:
          RUN: ${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          python tests/live/live_check.py > live.log 2>&1; code=$?
          cat live.log
          if [ $code -ne 0 ] && ! grep -q "::" live.log; then printf '::error::%s\n' "$(tail -30 live.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $code
